<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brettchenwebmustersammlung</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Brettchenwebmustersammlung</h1>
    <p>Willkommen zur Brettchenwebmustersammlung! Hier findest du eine Vielzahl von Mustern für das Brettchenweben. Stöbere durch die Sammlung und lass dich inspirieren!</p>   
    
    <h2>Muster hochladen</h2>
    <div id="uploadSection", class="container">
        <input type="text" id="Name" placeholder="Namen">
        <input type="number" id="anzahlBrettchen" placeholder="Anzahl der Brettchen">
        <input type="text" id="Typ">
        <input type="text" id="Design">
        <input type="file" id="MusterDatei" title="Musterbild">
        <input type="file" id="WebbriefDatei" title="Webbrief">
        <button id="patternSpeichern">Pattern speichern</button>
    </div>

    <h2>Mustersammlung</h2>
    <button id="patterns">Patterns laden</button>

    

    <script src="script.js"></script>
</body>
</html>
